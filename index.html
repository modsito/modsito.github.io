<!DOCTYPE HTML>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modsito Projects</title>
  <link rel="stylesheet" href="style.css">

  <!-- Fuente Inter ultra limpia -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- BOTÓN DE CONTACTO -->
<a href="mailto:modsitocontact@gmail.com?subject=Consulta%20Modsito%20Projects" class="btn-contacto" title="Contacto">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icono-correo">
    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
    <polyline points="22,6 12,13 2,6"></polyline>
  </svg>
</a>


  <!-- CONTENEDOR CENTRAL DE LA WEB -->
  <div class="web-wrapper">

    <!-- CABECERA CENTRADA -->
    <header class="sitio-header">
      <img src="mi_logo.png" alt="Logo Modsito" class="logo-img">
      <h1 class="sitio-titulo">MODSITO PROJECTS</h1>
    </header>

    <!-- PANTALLA PRINCIPAL (Lista de juegos) -->
    <main id="pantalla-inicio" class="apps-container">

  <!-- TARJETA 1: MINECRAFT -->
  <div class="app-card" onclick="mostrarDetalles('Minecraft', 'v26.45', '378MB', 'Descarga comprimida, incluye inicio de sesión Xbox y música. Elige la versión según la arquitectura de tu procesador.', 'https://www.mediafire.com/file/LINK_V8A', 'https://www.mediafire.com/file/LINK_V7A', 'minecraft-icon.png')">
    <div class="icon-wrapper">
      <img src="minecraft-icon.png" alt="Minecraft" class="app-icon">
    </div>
    <div class="app-name">Minecraft</div>
  </div>

  <!-- TARJETA 2: PATO PLAYER -->
  <div class="app-card" onclick="mostrarDetalles('Pato Player', 'v27', '9MB', 'App para ver deportes. Descarga 1:App principal. Descarga 2:Reproductor (obligatorio para usar la app).', 'https://www.mediafire.com/file/tu881z8z23tkb6y/PatoplayerPro27.apk/file', 'https://www.mediafire.com/file/tjevsp682g90027/UiPlayerPro8.apk/file', 'patoplayer-icon.png')">
    <div class="icon-wrapper">
      <img src="patoplayer-icon.png" alt="Pato Player" class="app-icon">
    </div>
    <div class="app-name">Pato Player</div>
  </div>

</main>

    <!-- PANTALLA DETALLES (Se activa mediante JS) -->
    <div id="pantalla-detalles" class="vista-detalles">
      <a href="#" class="btn-volver" onclick="volverAlInicio()">← Volver</a>
      
      <div class="detalles-header">
        <img id="det-icon" src="" class="detalles-icon">
        <div class="detalles-title-box">
          <h2 id="det-name">Nombre del Juego</h2>
          <div class="detalles-subtitle">Verificado</div>
        </div>
      </div>

      <!-- TABLA DE INFORMACIÓN -->
      <table class="info-table">
        <tr>
          <td class="info-label">Versión</td>
          <td id="det-version" class="info-value">--</td>
        </tr>
        <tr>
          <td class="info-label">Tamaño</td>
          <td id="det-peso" class="info-value">--</td>
        </tr>
        <tr>
          <td class="info-label">Mod Info</td>
          <td id="det-novedades" class="info-value">--</td>
        </tr>
      </table>

      <!-- ADVERTENCIA SUTIL -->
      <div class="alerta-box">
        <strong>Aviso:</strong> Este archivo fue comprobado por varios usuarios, no debería dar errores.
      </div>

      <!-- BOTONES DE DESCARGA -->
<div class="descargas-container">
  <a id="btn-descarga-v8a" href="#" target="_blank" class="btn-descargar-global">Descarga 1</a>
  <a id="btn-descarga-v7a" href="#" target="_blank" class="btn-descargar-global btn-v7a">Descarga 2</a>
</div>

  </div>

  <script src="script.js"></script>
</body>
</html>
